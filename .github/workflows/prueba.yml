name: Prueba tokens
on: push
jobs:
  comparar:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "OK: DEV_TOKEN coincide con LOCAL_DEV_TOKEN"
          } else {
            Write-Host "ERROR: DEV_TOKEN no coincide con LOCAL_DEV_TOKEN"
            exit 1
          }
